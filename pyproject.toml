[project]
name = "scs"
version = "0.1.0"
description = "Headless semantic code indexing and intelligence service"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "mcp>=1.25",
    "pathspec>=1.1.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "uvicorn>=0.41",
    "watchfiles>=1.2.0",
]

[project.scripts]
scs = "scs.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "coverage>=7.15.3",
    "hypothesis>=6.156.6",
    "pre-commit>=4.6.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scs", "proxy/src/scs_mcp_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/scs"]

[tool.coverage.report]
fail_under = 83
precision = 2
show_missing = true
skip_covered = true

[tool.basedpyright]
include = ["src/scs"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "src", extraPaths = ["proxy/src"] },
]
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportUnannotatedClassAttribute = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Framework decorators register otherwise-private handlers by side effect.
reportUnusedFunction = false
