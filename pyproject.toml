[project]
name = "scs"
version = "0.1.8"
description = "Headless semantic code indexing and intelligence service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Leonardo Venturini" }]
keywords = ["mcp", "semantic-search", "code-intelligence", "graph", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]
dependencies = [
    "aiohttp>=3.14",
    "mcp>=2.1.1",
    "pathspec>=1.1.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.urls]
Homepage = "https://github.com/leonardoventurini/scs"
Repository = "https://github.com/leonardoventurini/scs"
Issues = "https://github.com/leonardoventurini/scs/issues"
Changelog = "https://github.com/leonardoventurini/scs/blob/main/CHANGELOG.md"

[project.scripts]
scs = "scs.cli:main"
scs-mcp = "scs.mcp.stdio:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "coverage>=7.15.3",
    "hypothesis>=6.156.6",
    "pre-commit>=4.6.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/scs-python/Cargo.toml"
module-name = "scs._scs_native"
python-source = "src"
features = ["python"]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "crates/**", format = "sdist" },
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/scs"]

[tool.coverage.report]
fail_under = 83
precision = 2
show_missing = true
skip_covered = true

[tool.basedpyright]
include = ["src/scs"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "src" },
]
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportUnannotatedClassAttribute = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Framework decorators register otherwise-private handlers by side effect.
reportUnusedFunction = false
