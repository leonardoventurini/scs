[project]
name = "scs"
version = "0.1.0"
description = "Headless semantic code indexing and intelligence service"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
scs = "scs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scs"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

