[project]
name = "scs"
version = "0.1.0"
description = "Headless semantic code indexing and intelligence service"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "mcp>=1.25",
    "pathspec>=1.1.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
scs = "scs.cli:main"
scs-mcp = "scs.mcp.stdio:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "coverage>=7.15.3",
    "hypothesis>=6.156.6",
    "pre-commit>=4.6.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/scs-python/Cargo.toml"
module-name = "scs._scs_native"
python-source = "src"
features = ["python"]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
    { path = "crates/**", format = "sdist" },
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/scs"]

[tool.coverage.report]
fail_under = 83
precision = 2
show_missing = true
skip_covered = true

[tool.basedpyright]
include = ["src/scs"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "src" },
]
reportAny = "error"
reportExplicitAny = "error"
reportImplicitOverride = "error"
reportMissingTypeStubs = "error"
reportUnannotatedClassAttribute = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Framework decorators register otherwise-private handlers by side effect.
reportUnusedFunction = false
