[workspace]
resolver = "2"
members = [
    "crates/scs-core",
    "crates/scs-store",
    "crates/scs-parser",
    "crates/scs-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/techstertech/scs"

[workspace.dependencies]
# Internal crates
scs-core = { path = "crates/scs-core" }
scs-store = { path = "crates/scs-store" }
scs-parser = { path = "crates/scs-parser" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

# Pooling
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Error handling
thiserror = "2"

# Enums
strum = { version = "0.26", features = ["derive"] }

# IDs and hashing
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HNSW vector index for embedding search
usearch = "2.16"

# Logging
log = "0.4"
env_logger = "0.11"

# Tree-sitter
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-rust = "0.24"
tree-sitter-elixir = "0.3"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"

# FFI
pyo3 = { version = "0.23", features = ["extension-module"] }

# Randomized temporary filenames for atomic vector-index writes
rand = "0.8"

# Testing
tempfile = "3"
