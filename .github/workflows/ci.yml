name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98 --profile minimal --component clippy,rustfmt
      - name: Install just 1.58.0
        run: cargo install just --locked --version 1.58.0
      - name: Verify locked dependencies
        run: uv sync --all-groups --frozen
      - name: Run full quality gate
        run: just verify

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject unpinned workflow actions
        run: |
          if grep -R --line-number -E 'uses: [^#[:space:]]+@(main|master|v[0-9]+)$' .github/workflows; then
            echo "Workflow actions must be pinned to full commit SHAs" >&2
            exit 1
          fi
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
